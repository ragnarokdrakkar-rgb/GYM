  function drawStrengthChart() {
    const host=main.querySelector('[data-strength-chart]');if(!host)return;
    const series=cgStrengthSeries(history,state.strengthKey);if(!series.length)return;
    const width=Math.floor(host.clientWidth);if(width<120)return;
    const signature=JSON.stringify([width,state.strengthKey,state.strengthSession,series]);
    if(host.dataset.signature===signature)return;host.dataset.signature=signature;
    const height=220,left=64,right=12,top=18,bottom=44;
    const times=series.map(p=>new Date(p.date+'T'+p.time).getTime()),values=series.map(p=>p.kg);
    const minTime=Math.min(...times),maxTime=Math.max(...times),minValue=Math.min(...values),maxValue=Math.max(...values);
    const pad=Math.max(2.5,(maxValue-minValue)*.15),low=Math.max(0,minValue-pad),high=maxValue+pad;
    const x=t=>minTime===maxTime?(left+width-right)/2:left+(t-minTime)/(maxTime-minTime)*(width-left-right);
    const y=v=>height-bottom-(v-low)/(high-low)*(height-top-bottom);
    const chosen=series.findIndex(p=>p.id===state.strengthSession),selected=series[Math.max(0,chosen)];
    const ticks=[0,1,2,3].map(i=>{const value=low+(high-low)*i/3,yy=y(value);return `<line x1="${left}" x2="${width-right}" y1="${yy}" y2="${yy}"/><text x="${left-9}" y="${yy+4}" text-anchor="end">${value.toLocaleString('sl-SI',{maximumFractionDigits:1})}</text>`;}).join('');
    const indices=[...new Set([0,Math.floor((series.length-1)/2),series.length-1])];
    const dateTicks=indices.map((i,n)=>`<text x="${x(times[i])}" y="${height-22}" text-anchor="${indices.length===1?'middle':n===0?'start':n===indices.length-1?'end':'middle'}">${new Date(series[i].date+'T12:00').toLocaleDateString('sl-SI',{day:'numeric',month:'numeric'})}</text>`).join('');
    host.innerHTML=`<svg class="cg-strength-svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="Graf zabeležene teže za ${esc(state.strengthKey)}; ${series.length} treningov, od ${fmt(minValue)} do ${fmt(maxValue)} kg"><title>Napredek teže po treningih</title>${ticks}<text x="10" y="14">kg</text><polyline points="${series.map((p,i)=>`${x(times[i])},${y(p.kg)}`).join(' ')}" fill="none" stroke="var(--cg-accent)" stroke-width="2.5"/>${series.map((p,i)=>`<g data-strength-point="${p.id}"><circle cx="${x(times[i])}" cy="${y(p.kg)}" r="13" fill="transparent"/><circle cx="${x(times[i])}" cy="${y(p.kg)}" r="${p.id===selected.id?6:4}" fill="${p.flagged?'var(--cg-pending)':'var(--cg-accent)'}" stroke="${p.id===selected.id?'var(--cg-text)':'var(--cg-bg)'}" stroke-width="2"/></g>`).join('')}${dateTicks}</svg>`;
  }

  function updatePlates() {

  function sheet(title,html,onSave,saveText='Shrani') {
    modalReturn=document.activeElement;layer.hidden=false;main.inert=true;nav.inert=true;header.inert=true;
    layer.innerHTML=`<section class="cg-sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="cg-title-row"><h2>${esc(title)}</h2>${button('modal-close',icon('x'),'cg-icon','aria-label="Zapri"')}</div><form>${html}<div class="cg-sheet-actions">${button('modal-close','Prekliči','cg-quiet')}<button type="button" data-modal-save class="cg-action">${saveText}</button></div></form></section>`;

  function setFields(s) {

  }
  const readSet = data => ({kg:Number(data.get('kg')),reps:Number(data.get('reps')),rpe:data.get('rpe')===''?null:Number(data.get('rpe'))});
  function rememberUndo(text,fn) {undo=fn;notify(text+' · možnost razveljavitve v zgodovini.');}
  function resolveExercise(b) {return (b.dataset.source==='history'?selectedSession()?.exercises:exercises)?.find(e=>e.id===b.dataset.exerciseId);}
  function editSet(b) {
    const e=resolveExercise(b),s=e?.sets.find(s=>s.id===b.dataset.editSet);if(!s)return;
    const previous={...s},session=selectedSession();
    const context=b.dataset.source==='history'?`${dateLabel(session.date)} · ${session.time} · ${esc(session.name)}<br>`:'';
    const ordinal=b.dataset.source==='history'?e.sets.indexOf(s)+1:e.plan.findIndex(p=>p.id===s.planId)+1;
    sheet('Popravi serijo',`<p class="cg-small">${context}${esc(e.name)} · serija ${ordinal}</p>${setFields(s)}`,data=>{
      Object.assign(s,readSet(data));rememberUndo('Serija popravljena',()=>Object.assign(s,previous));
    });
  }
  function deleteSet(b) {
    const e=resolveExercise(b),index=e?.sets.findIndex(s=>s.id===b.dataset.deleteSet);if(index===undefined||index<0)return;
    const set=e.sets[index];
    const ordinal=b.dataset.source==='history'?index+1:e.plan.findIndex(p=>p.id===set.planId)+1;
    sheet('Odstrani zabeleženo serijo?',`<p class="cg-small">${esc(e.name)} · serija ${ordinal}<br>${fmt(set.kg)} kg × ${set.reps} · RPE ${set.rpe??'—'}<br>Odstrani se samo ta testna serija.</p>`,()=>{
      e.sets.splice(index,1);
      rememberUndo('Serija odstranjena',()=>{e.sets.splice(index,0,set);});

  function restSettings() {
    const e=currentExercise();

  function logSet() {

    if(b.dataset.ex!==undefined){state.active=Number(b.dataset.ex);render();return;}
    if(b.dataset.day!==undefined){state.day=Number(b.dataset.day);render();return;}
    if(b.dataset.progress){state.progress=b.dataset.progress;render();return;}
    if(b.dataset.date){selectDate(b.dataset.date);render();return;}
    if(b.dataset.historyAdd){const e=selectedSession()?.exercises.find(e=>e.id===b.dataset.historyAdd);if(!e)return;sheet('Dodaj serijo v zgodovino',`<p class="cg-small">${dateLabel(state.selectedDate)} · ${esc(e.name)}</p>${setFields(e.sets.at(-1)||{kg:0,reps:8,rpe:8})}`,data=>{const set={id:uid(),...readSet(data)};e.sets.push(set);rememberUndo('Serija dodana',()=>{e.sets=e.sets.filter(s=>s.id!==set.id);});},'Dodaj');return;}
    if(b.dataset.move!==undefined){const i=Number(b.dataset.move),list=rosters[state.day];if(i>0)[list[i-1],list[i]]=[list[i],list[i-1]];render();return;}
    if(b.dataset.programEdit!==undefined){const e=rosters[state.day][Number(b.dataset.programEdit)];sheet('Uredi vajo',`<label>Ime vaje<input name="name" value="${esc(e.name)}" maxlength="70" required></label><label>Serije<input name="target" type="number" min="1" max="20" value="${e.target}" required></label><label>Ponovitve<input name="reps" type="number" min="1" max="100" value="${e.reps}" required></label><label class="cg-checkline"><input name="active" type="checkbox" ${e.active!==false?'checked':''}> Aktivna vaja</label>`,d=>{Object.assign(e,{name:d.get('name'),target:Number(d.get('target')),reps:Number(d.get('reps')),active:d.has('active')});notify('Program posodobljen v predogledu.');});return;}
    const act=b.dataset.act;if(!act)return;
    if(act==='modal-close'){closeSheet();return;}
    if(act==='focus')state.focus=!state.focus;
    else if(act==='prev')state.active=Math.max(0,state.active-1);
    else if(act==='next')state.active=Math.min(exercises.length-1,state.active+1);
    else if(act==='session-toggle'){if(state.session.running)pauseSession();else beginSession();}
    else if(act==='session-finish'){finishSession();return;}
    else if(act==='plan-add'){if(currentExercise().plan.length<20)addPlannedSets();return;}
    else if(act==='log'){logSet();return;}
    else if(act==='rest-settings'){restSettings();return;}
    else if(act==='rest-start')startRest(currentExercise());
    else if(act==='rest-stop')state.rest=null;
    else if(act==='rest-toggle'&&state.rest){const r=state.rest;if(r.paused){r.deadline=Date.now()+r.left*1000;r.paused=false;}else{r.left=cgRemaining(r);r.paused=true;}}
    else if((act==='rest-minus'||act==='rest-plus')&&state.rest){const r=state.rest,left=Math.max(0,cgRemaining(r)+(act==='rest-plus'?30:-30));if(!left){state.rest=null;notify('Počitek končan.');}else{r.left=left;r.deadline=Date.now()+left*1000;}}
    else if(act==='month-prev'||act==='month-next'){const d=new Date(state.year,state.month+(act==='month-next'?1:-1),1);selectDate(dateKey(d));}
    else if(act==='history-meta'){const h=selectedSession();if(!h)return;const previous={date:h.date,time:h.time,name:h.name,minutes:h.minutes};sheet('Uredi trening',`<label>Datum<input name="date" type="date" value="${h.date}" min="1900-01-01" max="2100-12-31" required></label><label>Ura<input name="time" type="time" value="${h.time}" required></label><label>Ime treninga<input name="name" value="${esc(h.name)}" maxlength="70" required></label><label>Trajanje (minute)<input name="minutes" type="number" min="1" max="600" value="${h.minutes}" required></label>`,d=>{Object.assign(h,{date:d.get('date'),time:d.get('time'),name:d.get('name'),minutes:Number(d.get('minutes'))});selectDate(h.date);state.historySession=h.id;rememberUndo('Trening popravljen',()=>{Object.assign(h,previous);selectDate(h.date);state.historySession=h.id;});});return;}
    else if(act==='find-flagged'){const records=history.filter(h=>h.exercises.some(e=>e.sets.some(suspicious)));if(records.length){const next=records[(records.findIndex(h=>h.id===state.historySession)+1)%records.length];selectDate(next.date);state.historySession=next.id;state.flagged=true;}}
    else if(act==='undo'&&undo){const fn=undo;undo=null;fn();notify('Zadnja sprememba razveljavljena.');}
    else if(act==='strength-back'){state.strengthKey='';state.strengthSession='';}
    else if(act==='strength-history'){const point=cgStrengthSeries(history,state.strengthKey).find(p=>p.id===state.strengthSession);if(point){selectDate(point.date);state.historySession=point.id;state.historyExercise=history.find(h=>h.id===point.id)?.exercises.find(e=>cgNameKey(e.name)===state.strengthKey)?.id||'';state.progress='Zgodovina';state.flagged=false;}}
    else if(act==='phase'){state.phase=state.phase==='Bulk'?'Cut':'Bulk';notify('Faza spremenjena. Vaje ostanejo iste.');}
    else if(act==='program')state.page='Program';
    else if(act==='history'){state.settingsView='history';state.flagged=false;}
    else if(act==='equipment'){state.equipmentReturn={page:state.page,settingsView:state.settingsView};state.page='Nastavitve';state.settingsView='equipment';}
    else if(act==='equipment-save'){saveEquipment();return;}
    else if(act==='settings-back')backFromSettings();
    else if(act==='program-add'){sheet('Dodaj vajo',`<label>Ime vaje<input name="name" placeholder="Npr. Pec deck" maxlength="70" required></label><label>Število serij<input name="sets" type="number" min="1" max="20" value="3" required></label>`,d=>{rosters[state.day].push({name:d.get('name'),target:Number(d.get('sets')),reps:10});notify('Vaja dodana v program.');},'Dodaj');return;}
    else if(act==='weight'){sheet('Nova meritev',`<label>Telesna teža (kg)<input name="weight" type="number" step="0.1" min="30" max="300" value="${state.lastWeight}" required></label>`,d=>{state.lastWeight=Number(d.get('weight'));notify('Testna meritev shranjena.');});return;}
    else if(act==='backup'){sheet('Varnostna kopija','<p class="cg-small">Predogled ne dostopa do pravih datotek in ne ustvarja varnostne kopije aplikacije.</p>',()=>{},'Razumem');return;}
    render();
  });
  function tick() {
    if(!root.isConnected){clearInterval(ticker);return;}
    main.querySelectorAll('[data-session-clock]').forEach(el=>el.textContent=clock(elapsedSession()));
    if(state.rest){const left=cgRemaining(state.rest);if(left<=0){state.rest=null;const host=main.querySelector('.cg-rest-host');if(host)host.innerHTML='';notify('Počitek končan. Nadaljuj, ko si pripravljen.');}else main.querySelectorAll('[data-rest-clock]').forEach(el=>el.textContent=clock(left));}
  }
  render();const ticker=setInterval(tick,500);document.addEventListener('visibilitychange',tick);
  if(window.ResizeObserver){const observer=new ResizeObserver(()=>{if(!root.isConnected){observer.disconnect();return;}drawStrengthChart();});observer.observe(root);}
  if(window.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSelect(design,'spacing',{label:'Gostota',options:['Kompaktno','Zračno']});tweak.addColorPicker(design,'accent',{label:'Poudarek',reference:'--cg-accent'});tweak.addSlider(design,'corners',{label:'Zaobljenost',min:4,max:20,unit:'px'});}
})();

</script>
